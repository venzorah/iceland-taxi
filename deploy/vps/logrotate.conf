# Use ONLY if the distro /etc/logrotate.d/nginx does not already cover these paths.
# Never configure the same log in two rotation rules.
/var/log/nginx/iceland-taxi.*.log {
    daily
    maxsize 20M
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 www-data adm
    sharedscripts
    postrotate
        /usr/sbin/nginx -s reopen
    endscript
}
