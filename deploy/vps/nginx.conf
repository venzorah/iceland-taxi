# Install under /etc/nginx/conf.d/iceland-taxi.conf (http context).
# First obtain the certificate with the temporary HTTP-only ACME server in the runbook.
# $uri deliberately omits query strings containing recovery/booking tokens.
log_format iceland_taxi '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent $request_time';
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name icelandtaxibooking.is;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://icelandtaxibooking.is$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name icelandtaxibooking.is;
    ssl_certificate /etc/letsencrypt/live/icelandtaxibooking.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icelandtaxibooking.is/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 8m;
    client_body_timeout 30s;
    access_log /var/log/nginx/iceland-taxi.access.log iceland_taxi;
    error_log /var/log/nginx/iceland-taxi.error.log warn;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host icelandtaxibooking.is;
        proxy_set_header X-Forwarded-Host icelandtaxibooking.is;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        # Next.js streamed responses and polling. No proxy cache for private/API responses.
        proxy_buffering off;
        proxy_cache off;
        # Preserve raw Teya request body and signature headers. Do not intercept API errors.
        proxy_intercept_errors off;
    }
}
