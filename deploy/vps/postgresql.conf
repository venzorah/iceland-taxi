# Include from postgresql.conf AFTER selecting a target major >= source major.
# Conservative starting values for the shared 8 GB / 4 vCPU VPS; measure before increasing.
listen_addresses = '127.0.0.1'
password_encryption = 'scram-sha-256'
max_connections = 50
shared_buffers = '512MB'
effective_cache_size = '3GB'
work_mem = '4MB'
maintenance_work_mem = '128MB'
idle_in_transaction_session_timeout = '60s'
log_statement = 'none'
# SQL/error detail may contain personal data; bound logs and restrict access.
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%a.log'
log_rotation_age = '1d'
log_rotation_size = '0'
log_truncate_on_rotation = on
