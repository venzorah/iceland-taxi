server {
    listen 80;
    server_name icelandtaxibooking.is www.icelandtaxibooking.is;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://icelandtaxibooking.is$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.icelandtaxibooking.is;

    ssl_certificate /etc/letsencrypt/live/icelandtaxibooking.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icelandtaxibooking.is/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://icelandtaxibooking.is$request_uri;
}

server {
    listen 443 ssl http2;
    server_name icelandtaxibooking.is;

    ssl_certificate /etc/letsencrypt/live/icelandtaxibooking.is/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icelandtaxibooking.is/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /api/payments/webhook/teya {
        auth_basic off;
        client_max_body_size 1m;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Next.js build-fingerprinted assets only. No disk/proxy cache.
    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 60s;
        # Preserve Next.js status-specific Cache-Control and the inherited X-Robots-Tag.
        # Successful fingerprinted assets are immutable; errors retain no-store.
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 60s;
        client_max_body_size 8m;
    }
}
